<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Batalha de Canhões — capa">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <radialGradient id="p1body" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>
    <radialGradient id="p2body" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Sun -->
  <g transform="translate(1080,140)" filter="url(#softshadow)">
    <g stroke="#fde68a" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-90" x2="0" y2="-65"/>
      <line x1="63" y1="-63" x2="46" y2="-46"/>
      <line x1="90" y1="0" x2="65" y2="0"/>
      <line x1="63" y1="63" x2="46" y2="46"/>
      <line x1="0" y1="90" x2="0" y2="65"/>
      <line x1="-63" y1="63" x2="-46" y2="46"/>
      <line x1="-90" y1="0" x2="-65" y2="0"/>
      <line x1="-63" y1="-63" x2="-46" y2="-46"/>
    </g>
    <circle r="55" fill="url(#sun)"/>
  </g>

  <!-- Background mountains -->
  <path d="M0,520 L120,400 L240,460 L360,360 L500,440 L640,360 L780,440 L920,360 L1060,440 L1180,400 L1280,460 L1280,720 L0,720 Z" fill="url(#hill1)" opacity="0.65"/>
  <path d="M0,580 L160,470 L320,520 L460,460 L620,520 L780,460 L940,520 L1100,470 L1280,540 L1280,720 L0,720 Z" fill="url(#hill2)" opacity="0.85"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="200" cy="150" rx="58" ry="22"/>
    <ellipse cx="240" cy="155" rx="42" ry="18"/>
    <ellipse cx="160" cy="155" rx="38" ry="16"/>
    <ellipse cx="780" cy="100" rx="62" ry="24"/>
    <ellipse cx="830" cy="105" rx="44" ry="18"/>
    <ellipse cx="730" cy="105" rx="40" ry="16"/>
  </g>

  <!-- Trees -->
  <g transform="translate(420,540)">
    <rect x="-7" y="0" width="14" height="34" fill="#78350f"/>
    <circle cx="0" cy="-12" r="28" fill="#15803d"/>
    <circle cx="-20" cy="-2" r="20" fill="#16a34a"/>
    <circle cx="20" cy="-2" r="20" fill="#16a34a"/>
  </g>
  <g transform="translate(820,560)">
    <rect x="-6" y="0" width="12" height="30" fill="#78350f"/>
    <circle cx="0" cy="-10" r="22" fill="#15803d"/>
    <circle cx="-16" cy="2" r="16" fill="#16a34a"/>
    <circle cx="16" cy="2" r="16" fill="#16a34a"/>
  </g>

  <!-- Player 1 cannon (blue) -->
  <g transform="translate(220,580)" filter="url(#softshadow)">
    <ellipse cx="0" cy="32" rx="55" ry="11" fill="#1e293b" opacity="0.35"/>
    <!-- Wheels -->
    <circle cx="-30" cy="22" r="14" fill="#1f2937"/>
    <circle cx="-30" cy="22" r="5" fill="#94a3b8"/>
    <circle cx="30" cy="22" r="14" fill="#1f2937"/>
    <circle cx="30" cy="22" r="5" fill="#94a3b8"/>
    <!-- Body -->
    <ellipse cx="0" cy="6" rx="42" ry="26" fill="url(#p1body)"/>
    <ellipse cx="-12" cy="-2" rx="14" ry="8" fill="#bfdbfe" opacity="0.5"/>
    <!-- Barrel -->
    <g transform="rotate(-35)">
      <rect x="0" y="-9" width="62" height="18" rx="9" fill="#1e40af"/>
      <rect x="50" y="-11" width="14" height="22" rx="5" fill="#0c1e5e"/>
    </g>
    <!-- Face: eyes -->
    <circle cx="-12" cy="-6" r="4" fill="#fff"/>
    <circle cx="-12" cy="-6" r="2" fill="#0f172a"/>
    <circle cx="6" cy="-6" r="4" fill="#fff"/>
    <circle cx="6" cy="-6" r="2" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M-8,6 Q-3,12 0,8 Q3,12 8,6" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Player 2 cannon (orange) -->
  <g transform="translate(1060,580)" filter="url(#softshadow)">
    <ellipse cx="0" cy="32" rx="55" ry="11" fill="#1e293b" opacity="0.35"/>
    <circle cx="-30" cy="22" r="14" fill="#1f2937"/>
    <circle cx="-30" cy="22" r="5" fill="#94a3b8"/>
    <circle cx="30" cy="22" r="14" fill="#1f2937"/>
    <circle cx="30" cy="22" r="5" fill="#94a3b8"/>
    <ellipse cx="0" cy="6" rx="42" ry="26" fill="url(#p2body)"/>
    <ellipse cx="-12" cy="-2" rx="14" ry="8" fill="#fed7aa" opacity="0.5"/>
    <!-- Barrel pointing left -->
    <g transform="rotate(180) rotate(-35)">
      <rect x="0" y="-9" width="62" height="18" rx="9" fill="#9a3412"/>
      <rect x="50" y="-11" width="14" height="22" rx="5" fill="#7c2d12"/>
    </g>
    <circle cx="12" cy="-6" r="4" fill="#fff"/>
    <circle cx="12" cy="-6" r="2" fill="#0f172a"/>
    <circle cx="-6" cy="-6" r="4" fill="#fff"/>
    <circle cx="-6" cy="-6" r="2" fill="#0f172a"/>
    <path d="M-8,6 Q-3,12 0,8 Q3,12 8,6" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Flying cannonball with trail -->
  <g>
    <circle cx="540" cy="320" r="6" fill="#1f2937" opacity="0.25"/>
    <circle cx="580" cy="290" r="7" fill="#1f2937" opacity="0.4"/>
    <circle cx="620" cy="270" r="8" fill="#1f2937" opacity="0.55"/>
    <circle cx="660" cy="260" r="11" fill="#0f172a"/>
    <circle cx="657" cy="257" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Title overlay -->
  <g transform="translate(640,200)" text-anchor="middle" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
    <text y="0" font-size="76" font-weight="900" fill="#0f172a" stroke="#fff" stroke-width="3" paint-order="stroke">BATALHA DE CANHÕES</text>
    <text y="46" font-size="26" font-weight="700" fill="#1e40af">Duelo de artilharia com matemática e armas especiais</text>
  </g>

  <!-- Corner badges -->
  <g transform="translate(60,640)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="0" y="0" width="190" height="46" rx="23" fill="#0f172a" opacity="0.85"/>
    <text x="20" y="29" font-size="18" font-weight="700" fill="#fbbf24">★ Armas especiais</text>
  </g>
  <g transform="translate(270,640)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="0" y="0" width="160" height="46" rx="23" fill="#0f172a" opacity="0.85"/>
    <text x="20" y="29" font-size="18" font-weight="700" fill="#22c55e">⚡ 3 dificuldades</text>
  </g>
</svg>
