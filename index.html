<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogos VR — Aprender jogando</title>
    <meta
      name="description"
      content="Jogos educativos criados por estudantes do Colégio Vicente Rijo. Jogue no navegador e aprenda criando."
    />
    <meta name="theme-color" content="#2563eb" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jogos VR — Aprender jogando" />
    <meta
      property="og:description"
      content="Jogos educativos criados por estudantes do Colégio Vicente Rijo."
    />
    <meta property="og:locale" content="pt_BR" />
    <script>
      try {
        var saved = localStorage.getItem("theme");
        if (
          saved === "dark" ||
          (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
