    <text x="56" y="72" fill="#93c5fd" font-size="15" font-weight="800" letter-spacing="4">JOGOS VR</text>

    <g transform="translate(430 96)">
      <g>
        <rect x="0" y="0" width="66" height="66" rx="12" fill="#22c55e" />
        <text x="33" y="45" fill="#ffffff" font-size="34" font-weight="900" text-anchor="middle">J</text>
      </g>
      <g>
        <rect x="76" y="0" width="66" height="66" rx="12" fill="#f59e0b" />
        <text x="109" y="45" fill="#ffffff" font-size="34" font-weight="900" text-anchor="middle">O</text>
      </g>
      <g>
