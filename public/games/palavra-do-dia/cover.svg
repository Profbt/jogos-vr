        <text x="185" y="45" fill="#ffffff" font-size="34" font-weight="900" text-anchor="middle">G</text>
      </g>
      <g>
        <rect x="228" y="0" width="66" height="66" rx="12" fill="#22c55e" />
        <text x="261" y="45" fill="#ffffff" font-size="34" font-weight="900" text-anchor="middle">A</text>
      </g>
      <g>
        <rect x="304" y="0" width="66" height="66" rx="12" fill="#475569" />
        <text x="337" y="45" fill="#ffffff" font-size="34" font-weight="900" text-anchor="middle">R</text>
      </g>

      <g transform="translate(0 92)">
        <rect x="0" y="0" width="66" height="66" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
        <text x="33" y="45" fill="#cbd5e1" font-size="34" font-weight="900" text-anchor="middle">C</text>
        <rect x="76" y="0" width="66" height="66" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
        <text x="109" y="45" fill="#cbd5e1" font-size="34" font-weight="900" text-anchor="middle">R</text>
        <rect x="152" y="0" width="66" height="66" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
        <text x="185" y="45" fill="#cbd5e1" font-size="34" font-weight="900" text-anchor="middle">I</text>
        <rect x="228" y="0" width="66" height="66" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
        <text x="261" y="45" fill="#cbd5e1" font-size="34" font-weight="900" text-anchor="middle">A</text>
        <rect x="304" y="0" width="66" height="66" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
        <text x="337" y="45" fill="#cbd5e1" font-size="34" font-weight="900" text-anchor="middle">R</text>
