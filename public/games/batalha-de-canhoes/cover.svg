<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Capa do jogo Batalha de Canhões">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65a30d" />
      <stop offset="1" stop-color="#3f6212" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#sky)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <circle cx="672" cy="76" r="36" fill="#fde047" />

  <!-- nuvens -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="180" cy="70" rx="46" ry="16" />
    <ellipse cx="212" cy="78" rx="30" ry="12" />
    <ellipse cx="540" cy="120" rx="40" ry="14" />
    <ellipse cx="568" cy="128" rx="26" ry="10" />
  </g>

  <!-- terreno -->
  <path d="M0 340 Q120 300 240 336 Q360 372 470 344 Q600 312 700 348 Q760 366 800 352 V450 H0 Z" fill="url(#hill)" />
  <path d="M0 340 Q120 300 240 336 Q360 372 470 344 Q600 312 700 348 Q760 366 800 352" fill="none" stroke="#a3e635" stroke-width="5" />

  <!-- trajetória tracejada -->
  <path d="M170 300 Q400 60 640 310" fill="none" stroke="#fbbf24" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" />
  <circle cx="405" cy="118" r="10" fill="#1f2937" />
  <circle cx="402" cy="115" r="3" fill="#e2e8f0" />

  <!-- canhão esquerdo (azul) -->
  <g transform="translate(150 326) rotate(-38)">
    <rect x="0" y="-9" width="58" height="18" rx="7" fill="#2563eb" />
  </g>
  <rect x="126" y="312" width="48" height="26" rx="7" fill="#1e40af" />
  <circle cx="138" cy="342" r="10" fill="#334155" />
  <circle cx="164" cy="342" r="10" fill="#334155" />
  <path d="M182 340 v-44 h22 l-22 12 z" fill="#2563eb" transform="translate(0 4)" />

  <!-- explosão -->
  <g transform="translate(640 306)">
    <circle r="26" fill="#ef4444" opacity="0.85" />
    <circle r="15" fill="#f59e0b" />
    <circle r="6" fill="#fde047" />
  </g>

  <!-- canhão direito (laranja) -->
  <g transform="translate(650 332) rotate(218)">
    <rect x="0" y="-9" width="58" height="18" rx="7" fill="#ea580c" />
  </g>
  <rect x="630" y="318" width="48" height="26" rx="7" fill="#c2410c" />
  <circle cx="640" cy="348" r="10" fill="#334155" />
  <circle cx="666" cy="348" r="10" fill="#334155" />

  <!-- títulos -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
    <text x="48" y="80" fill="#0c4a6e" font-size="15" font-weight="800" letter-spacing="4">JOGOS VR • MATEMÁTICA</text>
    <text x="46" y="140" fill="#0f172a" font-size="58" font-weight="900" letter-spacing="-1.5">Batalha de</text>
    <text x="46" y="200" fill="#0f172a" font-size="58" font-weight="900" letter-spacing="-1.5">Canhões</text>
    <text x="48" y="234" fill="#075985" font-size="18" font-weight="600">Resolva a conta, ajuste o ângulo e vença o duelo.</text>

    <g transform="translate(48 256)">
      <rect width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.55" stroke="#ffffff" />
      <text x="75" y="22" fill="#0c4a6e" font-size="12" font-weight="800" text-anchor="middle">2 JOGADORES + IA</text>
    </g>
    <g transform="translate(208 256)">
      <rect width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.55" stroke="#ffffff" />
      <text x="60" y="22" fill="#0c4a6e" font-size="12" font-weight="800" text-anchor="middle">6º E 7º ANOS</text>
    </g>
  </g>
</svg>
