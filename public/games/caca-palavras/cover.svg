        <rect x="192" y="128" width="56" height="56" rx="10" />
        <rect x="0" y="192" width="56" height="56" rx="10" />
        <rect x="64" y="192" width="56" height="56" rx="10" />
        <rect x="128" y="192" width="56" height="56" rx="10" />
      </g>
      <g fill="#0f172a" stroke="#fbbf24" stroke-width="2">
