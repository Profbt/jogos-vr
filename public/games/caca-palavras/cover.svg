    <g transform="translate(468 92)">
      <g fill="#1e293b" stroke="#334155" stroke-width="2">
        <rect x="0" y="0" width="56" height="56" rx="10" />
        <rect x="64" y="0" width="56" height="56" rx="10" />
        <rect x="128" y="0" width="56" height="56" rx="10" />
        <rect x="192" y="0" width="56" height="56" rx="10" />
        <rect x="0" y="64" width="56" height="56" rx="10" />
        <rect x="128" y="64" width="56" height="56" rx="10" />
